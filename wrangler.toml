# Configurazione per Cloudflare Workers Builds: ad ogni push su GitHub,
# Cloudflare esegue "npx wrangler deploy" da qui e aggiorna il Worker.
#
# "name" deve combaciare ESATTAMENTE con il Worker gia' creato su Cloudflare
# ("mygym-pt"), altrimenti il deploy prova a crearne uno nuovo invece di
# aggiornare quello esistente.
name = "mygym-pt"
main = "cloudflare-worker/worker.js"
compatibility_date = "2026-08-23"

# IMPORTANTE: la chiave GROQ_API_KEY non va mai scritta qui dentro (questo
# file finisce su GitHub). Si imposta dalla dashboard di Cloudflare
# (Worker "mygym-pt" -> Bindings -> Secrets Store) — istruzioni in
# cloudflare-worker/worker.js.
#
# NOTA: un tentativo di dichiarare qui il binding [[secrets_store_secrets]]
# ha rotto il collegamento gia' fatto a mano dalla dashboard (tornava
# "Invalid API Key" nonostante la chiave fosse corretta). Finche' non
# troviamo la sintassi giusta, il binding va ricollegato a mano dalla
# dashboard dopo un deploy che tocca questo file — il codice del Worker
# da solo non lo scollega mai.
